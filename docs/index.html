<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institut für digitale Herausforderungen</title>
    <meta name="description" content="Digital experiments, tools, and projects focused on programming, AI, internet culture, and data analysis.">
    <meta name="author" content="Nicky Reinert">
    <link rel="canonical" href="https://institut-fdh.de/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://institut-fdh.de/">
    <meta property="og:title" content="Institut für digitale Herausforderungen">
    <meta property="og:description" content="Digital experiments, tools, and projects focused on programming, AI, internet culture, and data analysis.">
    <meta property="og:image" content="https://institut-fdh.de/gfx/header.png">

    <!-- PWA / Discovery -->
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#dcdcdc">
    <link rel="icon" type="image/png" href="gfx/favicon.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="amts-header">
        <div class="amts-header-inner">
            <div class="amts-titles">
                <h1>Institut für digitale Herausforderungen</h1>
                <p class="amts-motto">Analysen - Tools - Wissen</p>
                <p>Persönliches Portfolio von <a href="https://nickyreinert.de">Nicky Reinert</a></p>
            </div>
        </div>
    </header>

    <nav class="register-nav" aria-label="Filter">
        <div class="nav-container">
            <div class="tag-filter-container">
                <div class="tag-filters" id="tagFilters">
                    <!-- Tags generated by JS -->
                </div>
            </div>

            <div class="controls">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Finden..." aria-label="Finden">
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="projects-section" id="analysisSection">
            <div class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="analysisGrid" aria-label="Bereich ein- oder ausklappen">
                    <span class="section-toggle-icon" aria-hidden="true">&lt;&gt;</span>
                </button>
                <nav class="header-nav" aria-label="Bereiche">
                    <a href="#analysisSection" class="header-nav-link is-current" aria-current="true" data-section-nav="analysisSection">Analysen <span class="header-nav-count" data-count-for="analysis">0</span></a>
                    <a href="#toolsSection" class="header-nav-link" data-section-nav="toolsSection">Werkzeuge <span class="header-nav-count" data-count-for="tools">0</span></a>
                    <a href="#nerdenzSection" class="header-nav-link" data-section-nav="nerdenzSection">Nerd Enzyklopädie <span class="header-nav-count" data-count-for="nerdenz">0</span></a>
                </nav>
            </div>
            <div class="project-grid" id="analysisGrid">
                <!-- Cards generated by JS -->
            </div>
        </section>

        <section class="projects-section" id="toolsSection">
            <div class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="toolsGrid" aria-label="Bereich ein- oder ausklappen">
                    <span class="section-toggle-icon" aria-hidden="true">&lt;&gt;</span>
                </button>
                <nav class="header-nav" aria-label="Bereiche">
                    <a href="#analysisSection" class="header-nav-link" data-section-nav="analysisSection">Analysen <span class="header-nav-count" data-count-for="analysis">0</span></a>
                    <a href="#toolsSection" class="header-nav-link is-current" aria-current="true" data-section-nav="toolsSection">Werkzeuge <span class="header-nav-count" data-count-for="tools">0</span></a>
                    <a href="#nerdenzSection" class="header-nav-link" data-section-nav="nerdenzSection">Nerd Enzyklopädie <span class="header-nav-count" data-count-for="nerdenz">0</span></a>
                </nav>
            </div>
            <div class="project-grid" id="toolsGrid">
                <!-- Cards generated by JS -->
            </div>
        </section>

        <section class="projects-section" id="nerdenzSection">
            <div class="section-header">
                <button type="button" class="section-toggle" aria-expanded="true" aria-controls="nerdenzGrid" aria-label="Bereich ein- oder ausklappen">
                    <span class="section-toggle-icon" aria-hidden="true">&lt;&gt;</span>
                </button>
                <nav class="header-nav" aria-label="Bereiche">
                    <a href="#analysisSection" class="header-nav-link" data-section-nav="analysisSection">Analysen <span class="header-nav-count" data-count-for="analysis">0</span></a>
                    <a href="#toolsSection" class="header-nav-link" data-section-nav="toolsSection">Werkzeuge <span class="header-nav-count" data-count-for="tools">0</span></a>
                    <a href="#nerdenzSection" class="header-nav-link is-current" aria-current="true" data-section-nav="nerdenzSection">Nerd Enzyklopädie <span class="header-nav-count" data-count-for="nerdenz">0</span></a>
                </nav>
            </div>
            <div class="project-grid" id="nerdenzGrid">
                <!-- Cards generated by JS -->
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="copyright">
                &copy; <span id="currentYear"></span> Institut für digitale Herausforderungen
            </div>
            <div class="social-links" id="socialLinks">
                <!-- Social links generated by JS -->
            </div>
        </div>
    </footer>

    <script src="script.js" type="module"></script>
</body>
</html>
