<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Mirror – Institut für digitale Herausforderungen</title>
    <meta name="description" content="Reflects HTTP request context for browser-side inspection and debugging of proxy and CDN configurations.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://institut-fdh.de/seiten/2025-mirror.html">
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "Header Mirror",
            "url": "https://institut-fdh.de/seiten/2025-mirror.html",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web Browser",
            "inLanguage": "en",
            "description": "Web tool for reflecting and interpreting request context and header information when debugging proxy, CDN, and browser behavior.",
            "isAccessibleForFree": true,
            "provider": {
                "@type": "Person",
                "name": "Nicky Reinert",
                "url": "https://nickyreinert.de"
            }
        }
        </script>
    <link rel="icon" type="image/png" href="../gfx/favicon.png">
    <link rel="stylesheet" href="iframes.css">
</head>
<body>
    <h1>Header Mirror</h1>
    <p id="mirror-desc-1">
        Header Mirror shows the technically relevant request context and helps analyze proxy, CDN, and browser behavior.
    </p>
    <p id="mirror-desc-2">
        Typical use cases include debugging header forwarding, cache paths, and redirects across web infrastructure.
    </p>
    
    <iframe src="https://9000.1-1-1.de/" title="Header Mirror" width="100%" height="400" style="border: 1px solid #ccc;"></iframe>
        <script>
            (function applyMirrorLanguage() {
                const de = {
                    metaDescription: 'Spiegelt HTTP-Request-Kontext im Browser und hilft beim Debugging von Proxy- und CDN-Konfigurationen.',
                    desc1: 'Header Mirror zeigt den technisch relevanten Request-Kontext und hilft bei der Analyse von Proxy-, CDN- und Browser-Verhalten.',
                    desc2: 'Typische Einsaetze sind das Debugging von Header-Weitergabe, Cache-Pfaden und Weiterleitungen ueber Web-Infrastrukturen.'
                };

                const en = {
                    metaDescription: 'Reflects HTTP request context for browser-side inspection and debugging of proxy and CDN configurations.',
                    desc1: 'Header Mirror shows the technically relevant request context and helps analyze proxy, CDN, and browser behavior.',
                    desc2: 'Typical use cases include debugging header forwarding, cache paths, and redirects across web infrastructure.'
                };

                const langParam = new URLSearchParams(window.location.search).get('lang');
                const storedLang = localStorage.getItem('ifdh_lang');
                const lang = langParam === 'de' || storedLang === 'de' ? 'de' : 'en';
                const t = lang === 'de' ? de : en;

                document.documentElement.lang = lang;
                const meta = document.querySelector('meta[name="description"]');
                if (meta) meta.setAttribute('content', t.metaDescription);

                const p1 = document.getElementById('mirror-desc-1');
                const p2 = document.getElementById('mirror-desc-2');
                if (p1) p1.textContent = t.desc1;
                if (p2) p2.textContent = t.desc2;
            })();
        </script>

</body>
</html>
