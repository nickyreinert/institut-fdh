<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background: DOS blue -->
  <rect width="64" height="64" fill="#0000AF"/>

  <!-- Floppy disk body -->
  <rect x="10" y="8" width="44" height="48" rx="3" ry="3" fill="#50FFFF"/>

  <!-- Disk slot (top-right cutout) -->
  <polygon points="42,8 54,8 54,20 42,20" fill="#0000AF"/>
  <polygon points="42,8 54,20 42,20" fill="#50FFFF"/>

  <!-- Label area with German flag colors -->
  <rect x="15" y="12" width="24" height="22" fill="#000000"/>
  <rect x="15" y="12" width="24" height="7"  fill="#000000"/>
  <rect x="15" y="19" width="24" height="8"  fill="#CC0000"/>
  <rect x="15" y="27" width="24" height="7"  fill="#FFCC00"/>

  <!-- Metal shutter area -->
  <rect x="10" y="42" width="44" height="14" rx="0" fill="#008080"/>

  <!-- Shutter slot -->
  <rect x="24" y="44" width="16" height="10" rx="1" fill="#0000AF"/>

  <!-- Write-protect notch -->
  <rect x="44" y="10" width="8" height="8" rx="1" fill="#0000AF"/>
</svg>
