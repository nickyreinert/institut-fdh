name: Build SEO files

# Regenerates docs/sitemap.xml, docs/llms.txt, the pre-rendered homepage and the
# SEO head blocks (scripts/build.py) whenever content changes, and fails on lint errors.
on:
  push:
    branches: [main]
    paths:
      - 'docs/data-*.json'
      - 'src/**'
      - 'docs/index.html'
      - 'docs/en/index.html'
      - 'scripts/build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/build.py
      - name: Commit generated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            git commit -m "Regenerate sitemap, llms.txt and SEO blocks"
            git push
          fi
